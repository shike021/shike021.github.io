
<!-- HEAD Start -->

<head>
  {% include force-https.html %}
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{site.description}}">
  <meta name="author" content="{{site.author}}">
  <meta name="keywords" content="{{site.keywords}}">
  <link rel="canonical" href="{{page.url | replace:'index.html','' | prepend: site.baseurl}}">
  <title>{{site.title}}{% if page.title %} | {{page.title}}{% endif %}</title>

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{site.url}}{{page.url | replace:'index.html',''}}">
  <meta property="og:title" content="{{site.title}}{% if page.title %} | {{page.title}}{% endif %}">
  <meta property="og:description" content="{{site.description}}">
  <meta property="og:image" content="{{site.url}}{{site.baseurl}}{{site.me-img}}">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="{{site.url}}{{page.url | replace:'index.html',''}}">
  <meta property="twitter:title" content="{{site.title}}{% if page.title %} | {{page.title}}{% endif %}">
  <meta property="twitter:description" content="{{site.description}}">
  <meta property="twitter:image" content="{{site.url}}{{site.baseurl}}{{site.me-img}}">

  <!-- Bootstrap Core CSS -->
  <link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.3.7/css/bootstrap.css"
  />

  <!-- Custom CSS -->
  <link href="{{site.baseurl}}/css/grayscale.css" rel="stylesheet">
  {% if page.section-type == "index" %}
  <link href="{{site.baseurl}}/css/timeline.css" rel="stylesheet">
  {% endif %}

  <!-- Custom Fonts -->
  <link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />
  <link
  href="//fonts.googleapis.com/css?family=Lora:400,700,400italic,700italic"
  rel="stylesheet"
  type="text/css"
  /> 
  <link
  href="//fonts.googleapis.com/css?family=Montserrat:400,700"
  rel="stylesheet"
  type="text/css"
  />

  <link rel="stylesheet" href="{{site.baseurl}}/css/rrssb.css" />

  {% if site.favicon %}
    <link rel="shortcut icon" type="image/x-icon" href="{{site.baseurl}}{{site.favicon}}">
  {% endif %}

  {% include web-app.html %}

  {% include color-browser.html %}

  {% include syntax-highlight.html %}

</head>

<!-- HEAD End -->
